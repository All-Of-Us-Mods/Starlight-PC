name: Release

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [nightly, stable]
        default: nightly
      version:
        description: "Stable only: ship as this version instead of the one the nightly previewed (e.g. 2.2.0)"
        required: false
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || inputs.channel == 'stable' && 'stable' || 'nightly' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: plan
        env:
          CHANNEL: ${{ github.event_name == 'pull_request' && 'check' || inputs.channel || 'nightly' }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          last_nightly=$(git tag --list 'v*-nightly.*' --sort=-creatordate | head -n1)
          ref=$GITHUB_SHA

          case "$CHANNEL" in
            check)
              version=0.0.0-check ;;
            stable)
              if [ -z "$last_nightly" ]; then
                echo "::error::No nightly to promote."
                exit 1
              fi
              ref=$(git rev-list -n1 "$last_nightly")
              version=${VERSION_OVERRIDE:-$(echo "$last_nightly" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-nightly\..*/\1/')}
              version=${version#v}
              if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Invalid stable version: $version"
                exit 1
              fi
              if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                echo "::error::v$version already exists."
                exit 1
              fi
              echo "::notice::Promoting $last_nightly ($ref) to v$version" ;;
            nightly)
              if [ -n "$last_nightly" ] && [ "$(git rev-list -n1 "$last_nightly")" = "$GITHUB_SHA" ]; then
                echo "::notice::No commits since $last_nightly, skipping."
                exit 0
              fi
              stable=$(git -c versionsort.suffix=- tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v -- '-nightly\.' | head -n1)
              IFS=. read -r major minor patch <<< "$(echo "${stable:-v0.0.0}" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
              version="$major.$minor.$((patch + 1))-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" ;;
          esac

          {
            echo "channel=$CHANNEL"
            echo "version=$version"
            echo "ref=$ref"
            echo "short_sha=${ref::12}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::$CHANNEL $version"

  build:
    needs: plan
    if: needs.plan.outputs.channel != ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Stamp version into Cargo.toml
        shell: bash
        run: sed -i "0,/^version = /s|^version = .*|version = \"$VERSION\"|" Cargo.toml

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxcb1-dev \
            libgl-dev \
            libvulkan-dev

      - run: cargo build --release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item target/release/Starlight.exe dist/Starlight-windows-x86_64.exe
          packaging\windows\fetch-bepinex.ps1
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=$env:VERSION /O"dist" packaging\windows\starlight.iss

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/build-appimage.sh
          mkdir dist
          cp target/release/Starlight dist/Starlight-linux-x86_64
          mv Starlight-linux-x86_64.AppImage dist/

      - name: Package (Linux distributions)
        if: runner.os == 'Linux' && env.CHANNEL == 'stable'
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.43.1/nfpm_2.43.1_Linux_x86_64.tar.gz | tar -xz nfpm
          export NFPM_VERSION="$(echo "$VERSION" | sed 's/-/~/')"
          ./nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/Starlight-linux-x86_64.deb
          ./nfpm package -f packaging/linux/nfpm.yaml -p rpm -t dist/Starlight-linux-x86_64.rpm

          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak-builder --user --force-clean --repo=flatpak-repo flatpak-build packaging/linux/dev.allofus.Starlight.yml
          flatpak build-bundle flatpak-repo dist/Starlight-linux-x86_64.flatpak dev.allofus.Starlight

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Starlight-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.channel == 'stable' || needs.plan.outputs.channel == 'nightly'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NIGHTLY: ${{ needs.plan.outputs.channel == 'nightly' }}
      VERSION: ${{ needs.plan.outputs.version }}
      REF: ${{ needs.plan.outputs.ref }}
      SHORT_SHA: ${{ needs.plan.outputs.short_sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ env.REF }}
          name: ${{ env.NIGHTLY == 'true' && format('Starlight Nightly {0} ({1})', env.VERSION, env.SHORT_SHA) || '' }}
          draft: ${{ env.NIGHTLY != 'true' }}
          prerelease: ${{ env.NIGHTLY == 'true' }}
          body: ${{ env.NIGHTLY == 'true' && 'Automated nightly build of `main`. Set Settings → About → Updates → Release channel to **Nightly** in Starlight to get these automatically.' || '' }}
          generate_release_notes: true
          files: dist/*

      - name: Prune old nightlies
        if: env.NIGHTLY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | test("-nightly\\."))) | .tagName' \
            | tail -n +6 \
            | xargs -r -I{} gh release delete {} --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

[package]
name = "Starlight"
version = "2.3.0"
description = "Among Us mod manager"
authors = ["yanpla"]
license = "GPL-3.0-only"
repository = "https://github.com/All-Of-Us-Mods/Starlight-PC"
edition = "2024"
rust-version = "1.92.0"

[dependencies]
gpui-kit = { version = "0.7", features = ["tree-sitter-markdown"] }
# GPUI's HTTP client, bump the two together.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.7" }
tree-sitter = "0.26"
tree-sitter-md = "0.5"
rust-i18n = "4.2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }
async-broadcast = "0.7"
urlencoding = "2.1.3"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.11"
uuid = { version = "1.22.0", default-features = false, features = ["v4"] }
semver = { version = "1.0", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = ["Win32_System_LibraryLoader"] }
# Renders profile icons (png/jpg/…) into the .ico used by desktop shortcuts.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "bmp",
  "webp",
  "ico",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Debuginfo is what makes this tree expensive: gpui + gpui-component + windows
# generate hundreds of MB of it each, and every byte costs codegen time, link
# time and disk. Dependencies are never stepped through here, so they get none;
# our own code keeps line tables, which is all the panic backtraces in
# `init_logging` need.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
